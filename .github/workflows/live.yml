name: live smoke
on: workflow_dispatch

jobs:
  live:
    # This paid API smoke runs on demand after the account has usable credits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e quality
      - name: Live smoke (real Claude calls)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }
          python mvp/build/06_structured_output.py
          (cd first_hour && python tour/step1_message.py)
          python - <<'PY'
          from pathlib import Path
          from deslop.judge import judge_text

          result = judge_text(Path("quality/examples/clean.md").read_text())
          if not result.get("live"):
              raise SystemExit(f"quality judge did not run live: {result.get('error', 'no live result')}")
          PY
